# Create or update the destroyable VPN stack (VPC, instance, Elastic IP
# association, logs). The state bucket, deploy role, Elastic IP, budget,
# and the PKI in SSM are not in this state. The production environment
# is the approval gate.

name: Infra up

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openvpn-production
  cancel-in-progress: false

jobs:
  apply:
    name: Apply vpn stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check deploy role variable
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "$ROLE_ARN" ]; then
            echo "Set the repository variable AWS_DEPLOY_ROLE_ARN to the deploy_role_arn output from infra/bootstrap." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: openvpn-up

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: infra/.opentofu-version
          tofu_wrapper: false

      - name: Resolve UDP 1194 allowlist
        env:
          VPN_ALLOWED_CIDRS: ${{ vars.VPN_ALLOWED_CIDRS }}
        run: |
          set -euo pipefail
          json="$(bash scripts/allowed-cidrs.sh)"
          echo "UDP 1194 allowlist: $json"
          {
            echo "TF_VAR_allowed_cidrs<<EOF"
            echo "$json"
            echo "EOF"
          } >>"$GITHUB_ENV"

      - name: Pass SSH public keys
        env:
          VPN_SSH_AUTHORIZED_KEYS: ${{ vars.VPN_SSH_AUTHORIZED_KEYS }}
        run: |
          set -euo pipefail
          keys="$(bash scripts/ssh-authorized-keys.sh)"
          count=0
          if [ -n "$keys" ]; then
            count="$(printf '%s\n' "$keys" | grep -c .)"
          fi
          echo "SSH public keys: $count"
          {
            echo "TF_VAR_ssh_authorized_keys<<SSHKEYS_EOF"
            printf '%s\n' "$keys"
            echo "SSHKEYS_EOF"
          } >>"$GITHUB_ENV"

      - name: Apply
        working-directory: infra/vpn
        run: |
          set -euo pipefail
          tofu init -input=false
          tofu apply -input=false -auto-approve -lock-timeout=10m
